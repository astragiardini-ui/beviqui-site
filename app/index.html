<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scarica BeviQui</title>
    <meta name="description" content="Scarica BeviQui: trovi le fontanelle d'acqua pubbliche più vicine a te. Gratis." />
    <link rel="icon" href="/favicon.png" />
    <meta property="og:title" content="Scarica BeviQui" />
    <meta property="og:description" content="Trova l'acqua pubblica vicino a te. Gratis." />
    <meta property="og:image" content="/og-image.png" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        background: linear-gradient(165deg, #12A2B4, #076078);
        color: #fff; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        padding: 32px 22px calc(32px + env(safe-area-inset-bottom));
      }
      .wrap { width: 100%; max-width: 360px; text-align: center; }
      /* Icona come una vera icona-app: piastrella arrotondata con ombra morbida, non un quadrato tagliato. */
      .logo { width: 96px; height: 96px; margin: 0 auto 22px; display: block;
              border-radius: 23px; box-shadow: 0 12px 32px rgba(0,0,0,.30); }
      h1 { font-size: 29px; line-height: 1.15; margin-bottom: 12px; letter-spacing: -.4px; font-weight: 800; }
      .sub { font-size: 16px; opacity: .9; line-height: 1.5; margin-bottom: 34px; }
      /* Un solo stile per tutti i pulsanti: bianchi, coerenti. Niente stacco di colore fra le piattaforme. */
      .btn {
        display: flex; align-items: center; justify-content: center; gap: 10px;
        width: 100%; padding: 17px 18px; border-radius: 15px; text-decoration: none;
        font-size: 17px; font-weight: 700; margin-bottom: 12px;
        background: #fff; color: #0B4C5E; box-shadow: 0 8px 24px rgba(0,0,0,.16);
        transition: transform .12s ease;
      }
      .btn svg { flex: none; }
      .btn:active { transform: scale(.98); }
      .nota { font-size: 13px; opacity: .78; margin-top: 22px; line-height: 1.5; }
      .nota a { color: #fff; }
      .hide { display: none !important; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="logo" src="/logo-mark.png" alt="BeviQui" />
      <h1>Scarica BeviQui</h1>
      <p class="sub">Le fontanelle d'acqua pubbliche più vicine a te. Gratis: apri e usi subito.</p>

      <a class="btn" id="ios" href="https://apps.apple.com/it/app/id6775767613">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" aria-hidden="true"><path d="M16.36 12.72c-.02-2.3 1.88-3.4 1.96-3.45-1.07-1.56-2.73-1.78-3.32-1.8-1.41-.14-2.76.83-3.48.83-.72 0-1.83-.81-3-.79-1.54.02-2.96.9-3.75 2.28-1.6 2.78-.41 6.9 1.15 9.16.76 1.1 1.67 2.34 2.86 2.3 1.15-.05 1.58-.74 2.97-.74 1.39 0 1.78.74 3 .72 1.24-.02 2.02-1.12 2.78-2.23.88-1.28 1.24-2.52 1.26-2.58-.03-.01-2.41-.93-2.43-3.7zM14.1 5.9c.63-.77 1.06-1.83.94-2.9-.91.04-2.01.61-2.66 1.37-.58.68-1.09 1.76-.95 2.8 1.01.08 2.04-.51 2.67-1.27z"/></svg>
        Scarica dall'App Store
      </a>

      <a class="btn" id="android" href="/android/">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" aria-hidden="true"><path d="M17.6 9.48l1.84-3.18a.38.38 0 00-.14-.52.38.38 0 00-.52.14l-1.86 3.22a11.4 11.4 0 00-9.84 0L5.22 5.92a.38.38 0 00-.52-.14.38.38 0 00-.14.52L6.4 9.48A10.8 10.8 0 001 18h22a10.8 10.8 0 00-5.4-8.52zM7 15.25a1.1 1.1 0 110-2.2 1.1 1.1 0 010 2.2zm10 0a1.1 1.1 0 110-2.2 1.1 1.1 0 010 2.2z"/></svg>
        Android — entra tra i primi
      </a>

      <p class="nota">Nessuna registrazione: apri e usi tutto. · <a href="/">beviqui.it</a></p>
    </div>

    <script>
      // UN SOLO LINK CHE PORTA DOVE SERVE.
      // Chi arriva da un browser normale viene mandato subito dove deve andare (App Store su
      // iPhone, pagina Android sugli altri): un tocco solo, come dev'essere.
      // ⚠️ Dentro Instagram/Facebook NON si rimbalza: lì il passaggio allo store spesso non parte e
      // si finirebbe su una pagina bianca, senza nemmeno un pulsante da toccare. Meglio mostrare
      // questa pagina, che i pulsanti ce li ha.
      (function () {
        var ua = navigator.userAgent || '';
        // iPad con iPadOS 13+ si maschera da Mac: lo riconosco perche' ha il touch (un Mac vero no).
        var iPadComeMac = (navigator.platform === 'MacIntel' || /Macintosh/i.test(ua)) &&
                          typeof navigator.maxTouchPoints === 'number' && navigator.maxTouchPoints > 1;
        var iOS = /iPhone|iPad|iPod/i.test(ua) || iPadComeMac;
        var android = /Android/i.test(ua);
        // Browser DENTRO un social (Instagram, Facebook, ecc.): li' il rimbalzo verso l'App Store
        // puo' "morire" su una pagina bianca (limite del browser interno di Meta), percio' e' gestito
        // a parte.
        var dentroSocial = /Instagram|FBAN|FBAV|FBIOS|FB_IAB|TikTok|musical_ly|Snapchat|Line\/|Pinterest|Twitter|WhatsApp/i.test(ua);
        var resta = location.search.indexOf('resta=1') >= 0; // per vedere la pagina senza rimbalzo
        var APPSTORE = 'https://apps.apple.com/it/app/id6775767613';
        var btnIos = document.getElementById('ios');
        var btnAnd = document.getElementById('android');

        // Sul TELEFONO mostro UN SOLO pulsante, quello del suo sistema: niente doppioni, niente stacco
        // di colori fra le piattaforme. Sul computer (non so che telefono ha) restano entrambi.
        if (iOS) btnAnd.classList.add('hide');
        else if (android) btnIos.classList.add('hide');

        if (resta) return; // per vedere la pagina senza rimbalzo

        // ---- DENTRO INSTAGRAM / FACEBOOK ----
        if (dentroSocial) {
          // iPhone: niente rimbalzo forzato (dentro il browser di Meta finirebbe su una pagina
          // bianca): resta la pagina con il pulsante "Scarica dall'App Store", che si apre col tocco.
          // Android: /android e' una pagina web normale, il rimbalzo e' sicuro anche qui.
          if (android) location.replace('/android/');
          return;
        }

        // ---- BROWSER NORMALE (Safari/Chrome) ---- si va DRITTI, un tocco solo.
        // "https://apps.apple.com/..." e' un universal link: apre l'app App Store (mai schemi custom
        // tipo itms-apps:// che nei webview danno pagine vuote).
        if (iOS) location.replace(APPSTORE);
        else if (android) location.replace('/android/');
        // Da computer non si rimbalza: restano i due pulsanti.
      })();
    </script>
  </body>
</html>

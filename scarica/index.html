<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scarica BeviQui — l'app dell'acqua pubblica gratis</title>
  <meta name="description" content="Scarica BeviQui: trova fontanelle e acqua pubblica gratis vicino a te. Su iPhone dall'App Store. Gratis, senza registrazione." />
  <meta name="robots" content="index,follow" />
  <link rel="icon" href="/favicon.png" />
  <meta property="og:title" content="Scarica BeviQui" />
  <meta property="og:description" content="Trova l'acqua pubblica gratis vicino a te. Su iPhone dall'App Store." />
  <meta property="og:image" content="/og-image.png" />
  <style>
    :root { --teal: #0E7C86; --teal-dark: #0a5e66; --ink: #0f2a2d; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(160deg, var(--teal) 0%, var(--teal-dark) 100%);
      color: #fff; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 28px;
    }
    .card { width: 100%; max-width: 420px; text-align: center; }
    .logo { width: 96px; height: 96px; border-radius: 22px; background: #fff; padding: 10px; object-fit: contain; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    h1 { font-size: 30px; margin: 22px 0 6px; }
    .sub { font-size: 17px; opacity: .92; margin: 0 0 26px; line-height: 1.45; }
    .btns { display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 16px 18px; border-radius: 14px; font-size: 17px; font-weight: 700;
      text-decoration: none; background: #fff; color: var(--teal-dark);
      box-shadow: 0 6px 18px rgba(0,0,0,.18); transition: transform .12s ease;
    }
    .btn:active { transform: scale(.98); }
    .btn.soon { background: rgba(255,255,255,.18); color: #fff; box-shadow: none; cursor: default; }
    .btn.hi { outline: 3px solid #ffd84d; outline-offset: 2px; }
    .note { margin: 18px 0 0; font-size: 14px; opacity: .9; min-height: 18px; }
    .back { display: inline-block; margin-top: 26px; color: #fff; opacity: .85; font-size: 14px; text-decoration: none; }
    .back:hover { text-decoration: underline; }
  </style>
</head>
<body>
    <!-- Browser dei social (Instagram/Facebook): lì i link "scrivi una mail" vengono ignorati e a
         volte l'App Store non si apre. Si avvisa come uscirne, che è l'unica cosa che risolve. -->
    <div id="ig-hint" style="display:none;background:#12303A;color:#fff;padding:12px 16px;font:600 14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;text-align:center">
      Stai usando il browser di Instagram. Per scaricare l'app tocca <strong>⋯</strong> in alto a destra e scegli <strong>«Apri in Safari»</strong> (o Chrome).
    </div>
    <script>
      (function () {
        var ua = navigator.userAgent || '';
        if (/Instagram|FBAN|FBAV|FB_IAB|Line\/|TikTok/i.test(ua)) {
          var el = document.getElementById('ig-hint');
          if (el) el.style.display = 'block';
        }
      })();
    </script>

  <main class="card">
    <img class="logo" src="/logo.png" alt="BeviQui" />
    <h1>Scarica BeviQui</h1>
    <p class="sub">Trova l'acqua pubblica gratis vicino a te. 💧<br />Gratis, senza registrazione.</p>
    <div class="btns">
      <!-- iOS: LIVE su App Store dal 28/06/2026 -->
      <a id="ios" class="btn" href="https://apps.apple.com/it/app/beviqui-fontanelle-e-acqua/id6775767613"><svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true" style="vertical-align:-3px;margin-right:8px"><path d="M16.36 12.72c-.02-2.3 1.88-3.4 1.96-3.45-1.07-1.56-2.73-1.78-3.32-1.8-1.41-.14-2.76.83-3.48.83-.72 0-1.83-.81-3-.79-1.54.02-2.96.9-3.75 2.28-1.6 2.78-.41 6.9 1.15 9.16.76 1.1 1.67 2.34 2.86 2.3 1.15-.05 1.58-.74 2.97-.74 1.39 0 1.78.74 3 .72 1.24-.02 2.02-1.12 2.78-2.23.88-1.28 1.24-2.52 1.26-2.58-.03-.01-2.41-.93-2.43-3.7zM14.1 5.9c.63-.77 1.06-1.83.94-2.9-.91.04-2.01.61-2.66 1.37-.58.68-1.09 1.76-.95 2.8 1.01.08 2.04-.51 2.67-1.27z"/></svg>Scarica su App Store</a>
      <!-- Android: quando è sul Play Store, sostituire con:
           https://play.google.com/store/apps/details?id=com.beviqui.app -->
      <a id="android" class="btn soon" href="/android/"><svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true" style="vertical-align:-3px;margin-right:8px"><path d="M17.6 9.48l1.84-3.18a.38.38 0 00-.14-.52.38.38 0 00-.52.14l-1.86 3.22a11.4 11.4 0 00-9.84 0L5.22 5.92a.38.38 0 00-.52-.14.38.38 0 00-.14.52L6.4 9.48A10.8 10.8 0 001 18h22a10.8 10.8 0 00-5.4-8.52zM7 15.25a1.1 1.1 0 110-2.2 1.1 1.1 0 010 2.2zm10 0a1.1 1.1 0 110-2.2 1.1 1.1 0 010 2.2z"/></svg>Android — entra tra i primi</a>
    </div>
    <p class="note" id="note"></p>
    <a class="back" href="/">← Torna a beviqui.it</a>
  </main>
  <script>
    // Rileva il dispositivo ed evidenzia il pulsante giusto.
    var ua = navigator.userAgent || '';
    var isIOS = /iPhone|iPad|iPod/i.test(ua);
    var isAnd = /Android/i.test(ua);
    if (isIOS) {
      document.getElementById('ios').classList.add('hi');
      document.getElementById('note').textContent = 'Già disponibile su App Store per iPhone (iOS 15.1+).';
    }
    if (isAnd) {
      document.getElementById('android').classList.add('hi');
      document.getElementById('note').textContent = 'La versione Android sta arrivando. Su iPhone la scarichi già dall’App Store.';
    }
  </script>
    <script>
      // APRIRE L'APP STORE DAL BROWSER DI INSTAGRAM.
      // Dentro Instagram/Facebook il link normale spesso resta prigioniero della finestrella e non
      // arriva all'App Store. Lo schema di sistema "itms-apps://" invece viene passato a iOS, che
      // apre l'App Store vero. Si prova quello e, se non succede nulla, si ripiega sul link normale.
      (function () {
        var IN_APP = /Instagram|FBAN|FBAV|FB_IAB|Line\/|TikTok/i.test(navigator.userAgent || '');
        var HTTPS = 'https://apps.apple.com/it/app/beviqui-fontanelle-e-acqua/id6775767613';
        var SCHEMA = 'itms-apps://apps.apple.com/it/app/id6775767613';
        if (!IN_APP) return; // browser normale: il link fa già il suo lavoro
        document.querySelectorAll('a[href*="apps.apple.com"]').forEach(function (a) {
          a.addEventListener('click', function (e) {
            e.preventDefault();
            var andato = false;
            var ripiego = setTimeout(function () { if (!andato) window.location.href = HTTPS; }, 900);
            var uscito = function () { andato = true; clearTimeout(ripiego); };
            document.addEventListener('visibilitychange', uscito, { once: true });
            window.addEventListener('pagehide', uscito, { once: true });
            window.location.href = SCHEMA;
          });
        });
      })();
    </script>
  </body>
</html>
